  hyperlink-helper.tmbundle:   { isDefault: true }
  java.tmbundle:               { isDefault: true }
  javadoc.tmbundle:            { isDefault: true }
  javascript-jquery.tmbundle:  { isDefault: true }
  javascript.tmbundle:         { isDefault: true }
  json.tmbundle:               { isDefault: true }
  latex.tmbundle:              { isDefault: true }
  licenses.tmbundle:           { isDefault: true }
  lua.tmbundle:                { isDefault: true }
