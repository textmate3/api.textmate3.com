# api.textmate3.com
# .tmBundles catalog
#
# Opt-out model: every `bundles/*.tmbundle/` and `bundles/*-tmbundle/`
# checkout under `../bundles/` is exposed in `/bundles` by default.
# List exclusions and per-bundle metadata overrides below.
#
# Field reference (read by Frameworks/updater/src/updater.cc):
#   isMandatory: required by the app but users cannot uninstall (default false)
#   isDefault:   auto-installed on first launch and users can uninstall (default false)
#   category:    UI grouping in Bundle Editor / "Install Bundles" picker (default "Languages")
#
# Other metadata:
#   (name, uuid, contactName, contactEmailRot13, description, requires)
#   comes from each bundle's own info.plist and does not need to be repeated here

exclude: []

defaults:
  category: Languages
  isDefault: false
  isMandatory: false

# Per-bundle overrides: the key is the bundle directory name under ../bundles/
bundles:
  # System (required)
  bundle-support.tmbundle:
    isMandatory: true
    category: System

  # Bundle authoring
  bundle-development.tmbundle:
    isDefault: true
    category: Bundle Development

  # Default set (mirrors the api.textmate.org defaults)
  ada.tmbundle:                { isDefault: true }
  antlr.tmbundle:              { isDefault: true }
  applescript.tmbundle:        { isDefault: true }
  c.tmbundle:                  { isDefault: true }
